version: "3.9"

services:
  ollama:
    image: docker.io/ollama/ollama:rocm
    container_name: ollama
    ports:
      - "11434:11434"
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - keep-groups
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=5m
    volumes:
      - ./ollama_models:/root/.ollama/models:Z
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped

    depends_on:
      - ollama
      - open-terminal
      - searxng
    env_file:
      - .env
    environment:
      ### Core secrets
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}

      ### Ollama connection (NO UI setup required)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - OLLAMA_API_BASE_URL=${OLLAMA_BASE_URL}

      ### Single-user mode
      - WEBUI_AUTH=False
      - ENABLE_SIGNUP=False
      - DEFAULT_USER_ROLE=user
      - ENABLE_COMMUNITY_SHARING=False

      ### Open Terminal integration
      - ENABLE_OPEN_TERMINAL=True
      - OPEN_TERMINAL_URL=${OPEN_TERMINAL_URL}
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}

      ### Stability tuning
      - REQUEST_TIMEOUT=600
      - LOG_LEVEL=INFO

      ### Web Search
      - ENABLE_WEB_SEARCH=True
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search?q=<query>
      # Optional tuning
      - WEB_SEARCH_RESULTS_COUNT=5
      - WEB_SEARCH_ENGINE_TIMEOUT=10

    volumes:
      - ./open-webui:/app/backend/data:Z

    ports:
      - "3000:8080"
    
    tmpfs:
    - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512

  open-terminal:
    image: ghcr.io/open-webui/open-terminal:latest
    container_name: open-terminal
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OPEN_TERMINAL_API_KEY=${OPEN_TERMINAL_API_KEY}
    
    userns_mode: keep-id
    volumes:
      - ./open-terminal:/home/user:Z

    pids_limit: 1024
    mem_limit: 4g
    cpus: 4

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped

    environment:
      - SEARXNG_HOSTNAME=localhost
      - SEARXNG_BASE_URL=https://localhost/
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=SearXNG

    volumes:
      - ./searxng:/etc/searxng:Z
    ports:
    - "8080:8080"

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
